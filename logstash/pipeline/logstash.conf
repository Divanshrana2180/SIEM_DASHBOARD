input {
  file {
    path => "/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
  
  beats {
    port => 5044
  }
  
  tcp {
    port => 5000
    type => "syslog"
  }
}

filter {
  # 1. Try to parse JSON logs (for your sample-logs.log)
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }
  
  # 2. Try to parse Apache logs (for apache-logs.log)
  grok {
    match => { "message" => "%{COMBINEDAPACHELOG}" }
    tag_on_failure => ["_grokparsefailure"]
  }
  
  # 3. If Apache parsing failed, try to extract IP manually
  if "_grokparsefailure" in [tags] {
    grok {
      match => { "message" => "%{IP:clientip}" }
    }
  }
  
  # 4. Add GeoIP if IP exists
  if [clientip] {
    geoip {
      source => "clientip"
      target => "geoip"
    }
  }
  
  # 5. Security Alert Detection (Simplified & Safe)
  if [message] =~ /(?i)failed|error|unauthorized|denied|attack|malicious|suspicious|brute|injection|escalation|exfiltration|malware|scan|exploit|threat|violation|breach|intrusion|sql|xss|port\s*scan|privilege|exfil|certificate\s*expir/ {
    mutate {
      add_tag => ["security_alert"]
      add_field => { "alert_level" => "high" }
      add_field => { "threat_type" => "detected_keyword" }
    }
  }
  
  # 6. Specific Threat Type Mapping (Based on your sample data fields)
  if [event] == "login_failed" {
    mutate {
      add_field => { "threat_type" => "brute_force" }
    }
  }
  
  if [event] == "brute_force_attempt" {
    mutate {
      add_field => { "threat_type" => "brute_force" }
    }
  }

  if [event] == "sql_injection" {
    mutate {
      add_field => { "threat_type" => "sql_injection" }
    }
  }
  
  if [event] == "unauthorized_access" {
    mutate {
      add_field => { "threat_type" => "unauthorized_access" }
    }
  }
  
  if [event] == "malicious_connection" {
    mutate {
      add_field => { "threat_type" => "malware_communication" }
    }
  }
  
  if [event] == "privilege_escalation" {
    mutate {
      add_field => { "threat_type" => "privilege_escalation" }
    }
  }
  
  if [event] == "port_scan" {
    mutate {
      add_field => { "threat_type" => "reconnaissance" }
    }
  }
  
  if [event] == "data_exfiltration" {
    mutate {
      add_field => { "threat_type" => "data_exfiltration" }
    }
  }
  
  if [event] == "xss_attempt" {
    mutate {
      add_field => { "threat_type" => "xss" }
    }
  }
  
  if [event] == "malware_detected" {
    mutate {
      add_field => { "threat_type" => "malware" }
    }
  }
  
  # 7. Date Parsing (Ensure timestamps are correct)
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "dd/MMM/yyyy:HH:mm:ss Z" ]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "siem-logs-%{+YYYY.MM.dd}"
  }
  
  stdout {
    codec => rubydebug
  }
}
 